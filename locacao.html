<!DOCTYPE html>
<!-- LOCACAO_SEM_PRIMEIRO_ACESSO_V1 -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">

<style>
  /* LOCACAO_MOTOS_V1: página pública (cadastro por link, documentos) e portal do locatário */
  :root{--roxo:#770fa8;--roxo-esc:#5d0b85;--roxo-50:#faf7fd;--roxo-100:#f3e8fb;--roxo-200:#e9d5f9;--tinta:#111827;--muted:#6b7280;--linha:#e5e7eb;--linha2:#f3f4f6;--bg:#f9fafb}

  button:disabled{cursor:not-allowed}
  input,select,textarea{font:inherit;color:var(--tinta)}
  a{color:var(--roxo)}
  .sora{font-family:Sora,Inter,sans-serif}
  .mono{font-family:ui-monospace,Menlo,monospace}

  .top{background:#fff;border-bottom:1px solid var(--linha);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}

  .marca span{color:#9ca3af;font-weight:600}
  main{padding:16px 16px 32px;display:flex;flex-direction:column;gap:12px;flex:1}
  .card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .h1{margin:0;font-family:Sora,Inter,sans-serif;font-size:21px;font-weight:700}
  .sub{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}

  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}

  .fld>span.h{font-size:11.5px;color:var(--muted)}
  .fld>span.e{font-size:11.5px;color:#991b1b;font-weight:500}

  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g130{display:grid;grid-template-columns:130px 1fr;gap:10px}

  .btn.pri{background:var(--roxo);color:#fff}
  .btn.pri:disabled{background:#d8b4f0}
  .btn.sec{background:#fff;color:#374151;border:1px solid var(--linha)}
  .btn.ok{background:#16a34a;color:#fff}
  .lnk{color:var(--roxo);font-weight:600;font-size:13px;padding:0}
  .seg{display:grid;background:#f3f4f6;border-radius:10px;padding:3px;gap:3px}
  .seg button{height:38px;border-radius:8px;font-weight:600;color:var(--muted);font-size:13.5px}
  .seg button[aria-checked="true"]{background:#fff;color:var(--roxo-esc);font-weight:700;box-shadow:0 1px 2px rgba(17,24,39,.08)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .progress{height:6px;background:#f3f4f6;border-radius:99px;overflow:hidden}
  .progress>div{height:100%;background:var(--roxo)}
  .tile{border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
  .tile .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha2);font-size:13.5px}
  .nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0}
  .nav button[aria-current="page"]{color:var(--roxo);font-weight:700}
  .foto{aspect-ratio:1/1;border-radius:12px;position:relative;overflow:hidden;display:grid;place-items:center;width:100%}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .ov{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:480px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .spin{width:28px;height:28px;border-radius:99px;border:3px solid var(--roxo-200);border-top-color:var(--roxo);animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  :focus-visible{outline:2px solid var(--roxo);outline-offset:2px}
</style>
