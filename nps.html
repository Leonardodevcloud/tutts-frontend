<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3a1556">
<meta name="robots" content="noindex">
<title>Tutts · NPS</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<style>
  /* RH_NPS_V1: formulário público e anônimo do NPS interno (/nps/<token>) */
  :root{--roxo:#770fa8;--roxo-esc:#5d0b85;--roxo-fundo:#3a1556;--roxo-50:#faf5ff;--roxo-100:#f3e8fb;--roxo-200:#e9d5f9;--tinta:#111827;--muted:#6b7280;--muted2:#4b5563;--linha:#e5e7eb;--linha2:#f3f4f6;--bg:#f9fafb;--erro:#b91c1c}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tinta);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea{font:inherit;color:var(--tinta)}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
  .top{background:linear-gradient(120deg,#3a1556,#5d0b85);color:#fff;padding:22px 20px 30px;display:flex;flex-direction:column;gap:10px}
  .marca{font-family:Sora,Inter,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em}
  .titulo{font-family:Sora,Inter,sans-serif;font-weight:700;font-size:20px;margin:0}
  .promessa{color:#e9d5f9;font-size:13.5px;line-height:1.5;margin:0}
  .prog{display:flex;gap:10px;align-items:center;font-size:12.5px;color:#e9d5f9}
  .prog .barra{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  .prog .barra>span{display:block;height:100%;background:#fff;border-radius:99px;transition:width .2s}
  main{padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:-14px;flex:1}
  .secao{font-family:Sora,Inter,sans-serif;font-size:16px;font-weight:700;color:#fff;margin:4px 0 0}
  .card{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .card.falta{border:1.5px solid var(--erro);box-shadow:0 0 0 3px #fee2e2}
  fieldset.card{margin:0}
  legend.q,.q{font-weight:600;font-size:15px;line-height:1.4;padding:0;float:left;width:100%}
  legend.q+*{clear:both}
  .obr{color:var(--erro);margin-left:3px}
  .ajuda{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
  .msgfalta{font-size:13px;color:var(--erro);font-weight:600;margin:0}
  .notas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .notas button{height:46px;border-radius:10px;border:1px solid var(--linha);background:#fff;font-weight:700;font-size:15px;color:#374151}
  .notas button[aria-checked="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}
  .extremos{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:44px;padding:8px 14px;border-radius:99px;border:1px solid var(--linha);background:#fff;color:#374151;text-align:left;line-height:1.3;max-width:100%}
  .chip[aria-pressed="true"]{border-color:var(--roxo);background:var(--roxo-100);color:var(--roxo-esc);font-weight:600}
  .chip.desc{border-radius:14px}
  .chip small{display:block;font-weight:400;font-size:12px;color:var(--muted2);margin-top:2px}
  .opcao{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:12px;border:1px solid var(--linha);border-radius:12px;cursor:pointer;line-height:1.4}
  .opcao.on{border:2px solid var(--roxo);background:var(--roxo-50);padding:11px}
  .opcao input{accent-color:var(--roxo);width:18px;height:18px;margin:1px 0 0;flex:none}
  .opcao small{display:block;color:var(--muted2);font-size:12.5px;margin-top:2px}
  textarea.inp{width:100%;min-height:104px;padding:10px 12px;border:1px solid var(--linha);border-radius:12px;resize:vertical;line-height:1.45;font-size:15px;background:#fff}
  textarea.inp:focus{outline:none;border-color:var(--roxo);box-shadow:0 0 0 3px var(--roxo-100)}
  .cont{font-size:11.5px;color:var(--muted);text-align:right;margin-top:-6px}
  .cont.perto{color:#92400e;font-weight:600}
  .pessoa{border:1px solid var(--linha2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .pessoa b{font-size:14.5px}
  .pessoa .cargo{font-size:12px;color:var(--muted)}
  .rodape{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--linha);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:5}
  .btn{height:48px;border-radius:12px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
  .btn.pri{background:var(--roxo);color:#fff;flex:1}
  .btn.pri:disabled{background:#c4a5e0;cursor:wait}
  .btn.sec{background:#fff;color:#374151;border:1px solid var(--linha)}
  .lnk{color:var(--roxo);font-weight:600;font-size:13.5px;text-decoration:underline;padding:8px 0;min-height:44px}
  .aviso{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45}
  .aviso.erro{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}
  .centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px 24px}
  .centro h2{font-family:Sora,Inter,sans-serif;margin:0;font-size:21px}
  .centro p{margin:0;color:var(--muted2);line-height:1.55;max-width:420px}
  .ok{width:56px;height:56px;border-radius:50%;background:var(--roxo-100);color:var(--roxo);display:grid;place-items:center}
  .spin{width:28px;height:28px;border-radius:99px;border:3px solid var(--roxo-200);border-top-color:var(--roxo);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}.prog .barra>span{transition:none}}
  :focus-visible{outline:2px solid var(--roxo);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>
<noscript>Ative o JavaScript para responder o NPS.</noscript>

            try { window.scrollTo(0, 0); } catch (e) { /* ok */ }
          } else if (res.status === 410) {
            setEst({ fase: 'erro', titulo: 'NPS encerrado', msg: j.error || 'Este NPS não está mais recebendo respostas.' });
          } else {
            setErroEnvio(j.error || 'Não deu para enviar agora. Suas respostas continuam aqui — tente de novo.');
          }
        });
      }, function () {
        setErroEnvio('Sem conexão. Suas respostas continuam aqui — confira a internet e tente de novo.');
      }).then(function () { setEnviando(false); });
    }

    return h('div', { className: 'wrap' },
      Topo(d.nome, { atual: idx + 1, total: secoes.length, titulo: secao.titulo }, d.fecha_em),
      h('main', { ref: topoRef },
        perguntas.map(function (p) {
          return h(Pergunta, { key: p.id, p: p, d: d, resp: resp, set: set, falta: faltas && faltas[p.tipo === 'sensivel' ? 'sensivel' : p.id] });
        }),
        faltas ? h('div', { className: 'aviso erro', role: 'alert' }, 'Faltam respostas obrigatórias nesta etapa (marcadas em vermelho).') : null,
        erroEnvio ? h('div', { className: 'aviso erro', role: 'alert' }, erroEnvio) : null),
      h('div', { className: 'rodape' },
        idx > 0 ? h('button', { type: 'button', className: 'btn sec', onClick: function () { irPara(idx - 1); }, disabled: enviando }, 'Voltar') : null,
        h('button', { type: 'button', className: 'btn pri', onClick: avancar, disabled: enviando },
          enviando ? 'Enviando…' : ultimo ? (erroEnvio ? 'Tentar enviar de novo' : 'Enviar respostas') : 'Continuar')));
  }

  function Topo(nome, prog, fecha) {
    return h('header', { className: 'top' },
      h('span', { className: 'marca', 'aria-label': 'Tutts' }, 'tutts'),
      nome ? h('h1', { className: 'titulo' }, 'NPS de ' + nome) : null,
      h('p', { className: 'promessa' }, 'É anônimo. Não pedimos login, nome nem e-mail, e não guardamos seu IP.' + (fecha ? ' Aberto até ' + fmtData(fecha) + '.' : '')),
      prog ? h('div', { className: 'prog' },
        h('div', { className: 'barra', role: 'progressbar', 'aria-valuemin': 1, 'aria-valuemax': prog.total, 'aria-valuenow': prog.atual, 'aria-label': 'Progresso' },
          h('span', { style: { width: Math.round((prog.atual / prog.total) * 100) + '%' } })),
        'etapa ' + prog.atual + ' de ' + prog.total) : null,
      prog && prog.titulo ? h('h2', { className: 'secao' }, prog.titulo) : null);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
